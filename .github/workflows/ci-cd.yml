name: Microservices & Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-microservices:
    name: Build & Test Java Spring Boot Microservices (Onion Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Auth & Product Microservices
        run: |
          cd backend
          mvn clean test package -DskipTests=false

      - name: Build Docker Images (Local Validation)
        run: |
          docker build -t auth-service:latest ./backend/auth-service
          docker build -t product-service:latest ./backend/product-service

  frontend-react:
    name: Build & Validate React Frontend (Vercel Ready)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Production UI
        run: |
          cd frontend
          npm run build

  deploy-vercel-render:
    name: Deploy to Vercel (UI) & Render (Backend)
    needs: [backend-microservices, frontend-react]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      - name: Trigger Render Deploy Hook (Auth Service)
        run: |
          if [ -n "${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}"
          fi

      - name: Trigger Render Deploy Hook (Product Service)
        run: |
          if [ -n "${{ secrets.RENDER_PRODUCT_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_PRODUCT_DEPLOY_HOOK }}"
          fi
